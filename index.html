:root{--bg:#0b0f17;--card:#141a24;--line:#263041;--text:#e6ebf2;--muted:#8b97a8;--blue:#5aa9ff;--green:#22c55e;--pink:#ff6bb5;--amber:#ffb84d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

.b1{width:340px;height:340px;background:#3b82f6;top:-120px;left:-100px}
.b2{width:300px;height:300px;background:#a855f7;bottom:-100px;right:-80px;animation-delay:-5s}
.b3{width:220px;height:220px;background:#22c55e;top:40%;left:60%;opacity:.18;animation-delay:-9s}
@keyframes float{50%{transform:translate(40px,30px) scale(1.1)}}
.wrap{max-width:560px;margin:0 auto;padding:40px 18px 60px}
header{text-align:center;margin-bottom:26px}
.emoji{font-size:54px;display:inline-block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
h1{font-size:30px;font-weight:800;margin-top:6px;background:linear-gradient(90deg,#5aa9ff,#c084fc,#ff6bb5);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin-top:6px;font-size:15px}
.search{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 40px #0006}
.search label{font-size:13px;color:var(--muted);display:block;margin-bottom:8px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;background:#0d121b;border:1px solid var(--line);color:var(--text);font-size:18px;padding:14px 16px;border-radius:12px;outline:none;letter-spacing:1px;transition:.2s}
input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #5aa9ff22}
button{background:linear-gradient(135deg,#16a34a,#22c55e);border:none;color:#fff;font-weight:700;font-size:16px;padding:0 22px;border-radius:12px;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.95)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#out{margin-top:26px}
.title{text-align:center;font-size:24px;font-weight:800;margin-bottom:6px}
.stats{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px}
.next{background:linear-gradient(135deg,#1e3a8a55,#7e22ce44);border:1px solid #6366f155;border-radius:16px;padding:14px 16px;margin-bottom:16px;text-align:center}
.next b{color:var(--amber)}
.cd{display:flex;justify-content:center;gap:10px;margin-top:10px}
.cd div{background:#0b0f17aa;border-radius:10px;padding:8px 10px;min-width:62px}
.cd span{display:block;font-size:22px;font-weight:800}
.cd small{color:var(--muted);font-size:11px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;position:relative;overflow:hidden;opacity:0;transform:translateY(20px);animation:in .5s forwards}
@keyframes in{to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.card.done{opacity:.5!important}
.code{color:var(--blue);font-weight:800;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:#ffffff12;color:var(--muted)}
.tag.soon{background:#ffb84d22;color:var(--amber)}
.tag.today{background:#ff6bb533;color:var(--pink)}
.name{color:var(--muted);font-size:14px;margin:3px 0 12px}
.line{font-size:17px;margin:7px 0;display:flex;gap:10px;align-items:center}
.cal{margin-top:12px;background:none;border:1px solid var(--line);color:var(--muted);font-size:13px;padding:7px 12px;border-radius:9px;font-weight:600}
.cal:hover{color:var(--text);border-color:var(--blue)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .big{font-size:50px;margin-bottom:8px}
.tip{font-size:13px;color:var(--muted);text-align:center;margin-top:14px;min-height:18px;transition:opacity .4s}
footer{text-align:center;margin-top:30px;color:#5b6676;font-size:12px}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>

function parse(e){ // "02- Sunday, November 08, 2026", "10:30-11:30"
  const d=e[0].replace(/^\d+-\s*/,''); const [a,b]=e[1].split('-');
  const base=d.split(', ').slice(1).join(' ');
  return {label:d, start:new Date(base+' '+a), end:new Date(base+' '+b)};
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
let timer;
function search(id){
  const out=document.getElementById('out');clearInterval(timer);
  const idx=DATA.m[id];
  if(!id){return}
  if(!idx){
    out.innerHTML=`<div class="empty"><div class="big">🤔</div><b>No midterms found for ${esc(id)}</b><br><br>Check the number and try again — or maybe you're just lucky this term.</div>`;
    document.querySelector('.search').classList.add('shake');setTimeout(()=>document.querySelector('.search').classList.remove('shake'),400);
    return;
  }
  const list=idx.map(i=>({e:DATA.e[i],...parse(DATA.e[i])})).sort((x,y)=>x.start-y.start);
  const now=new Date();const upcoming=list.filter(x=>x.end>now);
  let html=`<div class="title">Schedule for ${esc(id)}</div><div class="stats">${list.length} midterm${list.length>1?'s':''} · ${upcoming.length} still ahead</div>`;
  if(upcoming.length){html+=`<div class="next">⏳ Next up: <b>${esc(upcoming[0].e[3])}</b><div class="cd" id="cd"></div></div>`}
  else html+=`<div class="next">🎉 All done! Midterms are behind you.</div>`;
  list.forEach((x,k)=>{
    const days=Math.floor((new Date(x.start).setHours(0,0,0,0)-new Date(now).setHours(0,0,0,0))/864e5);
    let tag='',cls='',tc='';
    if(x.end<now){tag='Done ✓';cls='done'}
    else if(days===0){tag='TODAY 🔥';tc='today'}
    else if(days===1){tag='Tomorrow';tc='soon'}
    else if(days<=3){tag=`In ${days} days`;tc='soon'}
    else tag=`In ${days} days`;
    html+=`<div class="card ${cls}" style="--c:${COLORS[k%COLORS.length]};animation-delay:${k*90}ms">
      <div class="code">${esc(x.e[3])}<span class="tag ${tc}">${tag}</span></div>
      <div class="name">${esc(x.e[4])}</div>
      <div class="line">📅 ${esc(x.label)}</div>
      <div class="line">⏰ ${esc(x.e[1])}</div>
      <div class="line">📍 Room: ${esc(x.e[2])}</div>
      ${x.end>now?`<button class="cal" data-k="${k}">➕ Add to calendar</button>`:''}
    </div>`;
  });
  out.innerHTML=html;
  out.querySelectorAll('.cal').forEach(b=>b.onclick=()=>ics(list[b.dataset.k]));
  if(upcoming.length){const t=upcoming[0].start;const tick=()=>{let s=Math.max(0,(t-new Date())/1e3);
    const u=[[Math.floor(s/86400),'days'],[Math.floor(s%86400/3600),'hrs'],[Math.floor(s%3600/60),'min'],[Math.floor(s%60),'sec']];
    const el=document.getElementById('cd');if(el)el.innerHTML=u.map(([v,l])=>`<div><span>${v}</span><small>${l}</small></div>`).join('')};tick();timer=setInterval(tick,1000)}
  confetti();
  try{localStorage.setItem('mid_id',id)}catch(e){}
  history.replaceState(null,'','#'+id);
}
function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'}
function ics(x){
  const s=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Midterm Finder//EN','BEGIN:VEVENT',
  'UID:'+x.e[3]+fmt(x.start)+'@midterms','DTSTAMP:'+fmt(new Date()),'DTSTART;TZID=Africa/Cairo:'+fmt(x.start),'DTEND;TZID=Africa/Cairo:'+fmt(x.end),
  'SUMMARY:'+x.e[3]+' Midterm','DESCRIPTION:'+x.e[4],'LOCATION:Room '+x.e[2],
  'BEGIN:VALARM','TRIGGER:-PT12H','ACTION:DISPLAY','DESCRIPTION:Midterm tomorrow','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/calendar'}));a.download=x.e[3]+'_midterm.ics';a.click();
}
function confetti(){const c=["#5aa9ff","#c084fc","#ff6bb5","#22c55e","#ffb84d"];
  for(let i=0;i<40;i++){const p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'vw';
  p.style.background=c[i%5];p.style.animationDuration=(1.6+Math.random()*1.6)+'s';p.style.animationDelay=Math.random()*.4+'s';
  document.body.appendChild(p);setTimeout(()=>p.remove(),3800)}}
const inp=document.getElementById('id');
document.getElementById('f').onsubmit=e=>{e.preventDefault();inp.value=inp.value.replace(/\D/g,'');search(inp.value);inp.blur()};
const start=location.hash.slice(1)||(()=>{try{return localStorage.getItem('mid_id')}catch(e){}})();
if(start&&/^\d+$/.test(start)){inp.value=start;search(start)}
</script>
</body>
</html>
